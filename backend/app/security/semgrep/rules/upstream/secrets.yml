rules:
  - id: arve.upstream.python.aws-secret-key
    languages: [python]
    severity: ERROR
    message: "Hardcoded AWS secret access key detected."
    metadata:
      cwe: ["CWE-798: Use of Hard-coded Credentials"]
      owasp: ["A07:2021 - Identification and Authentication Failures"]
      category: security
      confidence: HIGH
      provenance: upstream
      remediation_id: hardcoded-secret
      technology: [aws, python]
      arve_title: "Hardcoded AWS Secret Key"
    patterns:
      - pattern-regex: (?i)(aws_secret_access_key|aws_secret_key)\s*=\s*['"][A-Za-z0-9/+=]{40}['"]

  - id: arve.upstream.generic.private-key
    languages: [python, javascript, typescript]
    severity: ERROR
    message: "Hardcoded private encryption key block detected."
    metadata:
      cwe: ["CWE-798: Use of Hard-coded Credentials"]
      owasp: ["A07:2021 - Identification and Authentication Failures"]
      category: security
      confidence: HIGH
      provenance: upstream
      remediation_id: hardcoded-secret
      arve_title: "Hardcoded Private Key"
    patterns:
      - pattern-regex: -----BEGIN (RSA|EC|DSA|OPENSSH|PGP) PRIVATE KEY-----
